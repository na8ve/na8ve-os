name: Vision Saccade Classifier
description: Privacy-preserving edge visual classification with zero raw image persistence.
ports:
- 7000
bricks:
- arduino:web_ui
- na8ve:cognitive_os:
    variables:
      NA8VE_MODEL_NAME: bx-1m-l2-t036
      NA8VE_EXEC_MODE: recurrent
      NA8VE_STATE_WIDTH: int32
- na8ve:vision_saccade:
    variables:
      NA8VE_VISION_MODEL: vn8v-tin66
      NA8VE_SACCADE_COUNT: '8'
      NA8VE_CONFIDENCE_THRESHOLD: '0.25'
- na8ve:memory_graph:
    variables:
      NA8VE_DEFAULT_TIER: sensory
      NA8VE_MAX_RECALL_HOPS: '2'
- na8ve:act_policy:
    variables:
      NA8VE_ACT_COOLDOWN_MS: '250'
icon: "\U0001F4F7"
