name: Inter-Sandbox Model Broker
description: Asynchronous IPC cognitive query broker between isolated sandbox micro-virtual machines.
ports:
- 7000
bricks:
- arduino:web_ui
- na8ve:cognitive_os:
    variables:
      NA8VE_MODEL_NAME: bx-1m-l2-t036
      NA8VE_EXEC_MODE: recurrent
      NA8VE_STATE_WIDTH: int32
- na8ve:memory_graph:
    variables:
      NA8VE_DEFAULT_TIER: episodic
      NA8VE_MAX_RECALL_HOPS: '2'
icon: "\U0001F4E8"
